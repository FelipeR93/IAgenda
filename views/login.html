<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IAgenda – Login</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-logo">🏥</div>
    <h1>IAgenda</h1>
    <p class="subtitle">Sistema de Agendamento de Consultas</p>

    <div id="alert" class="alert alert-error" style="display:none;"></div>

    <form id="login-form">
      <div class="form-group">
        <label>Usuário</label>
        <input type="text" id="username" name="username" placeholder="Digite seu usuário" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
        <span id="btn-icon">🔐</span>
        <span id="btn-text">Entrar</span>
      </button>
    </form>

    <p style="margin-top: 24px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); padding-top: 16px;">
      💡 Acesso padrão: <strong>admin</strong> / <strong>admin123</strong>
    </p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertEl = document.getElementById('alert');
      const btn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');

      alertEl.style.display = 'none';
      btn.disabled = true;
      btnText.textContent = 'Entrando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao entrar');
        window.location.href = '/dashboard';
      } catch (err) {
        alertEl.textContent = '⚠️ ' + err.message;
        alertEl.style.display = 'flex';
        btn.disabled = false;
        btnText.textContent = 'Entrar';
      }
    });
  </script>

</body>
</html>
